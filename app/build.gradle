plugins { id 'com.android.application' }
android {
    namespace 'kr.chagok.ledger'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.chagok.ledger'
        minSdk 26
        targetSdk 36
        versionCode 24
        versionName '0.8.10'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        localTest { storeFile rootProject.file('local-test.keystore'); storePassword 'android'; keyAlias 'chagok-local'; keyPassword 'android' }
    }
    buildTypes { debug { signingConfig signingConfigs.localTest } }
}
