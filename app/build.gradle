plugins { id 'com.android.application' }
android {
    namespace 'kr.chagok.ledger'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.chagok.ledger'
        minSdk 26
        targetSdk 36
        versionCode 32
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        localTest { storeFile rootProject.file('local-test.keystore'); storePassword System.getenv('CHAGOK_KEYSTORE_PASSWORD'); keyAlias 'chagok-local'; keyPassword System.getenv('CHAGOK_KEYSTORE_PASSWORD') }
    }
    buildTypes { debug { signingConfig signingConfigs.localTest } }
}
